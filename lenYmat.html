<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="sticker">
  <title>Aventura de Palabras y Números — Aprendizaje Accesible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* Page and surfaces (Sticker style) */
      --background: #fef7ff;
      --surface-container-low: #ffffff;
      --surface-container: #f8eef8;
      --surface-container-high: #f2e8f2;

      /* Ink */
      --on-surface: #2e1a28;
      --on-surface-variant: #604868;

      /* Rules */
      --outline: #907898;
      --outline-variant: #dcc8e0;

      /* Accents */
      --primary: #c2207f;
      --on-primary: #ffffff;
      --primary-container: #f080c0;
      --on-primary-container: #2e1a28;
      --secondary: #7c52aa;
      --on-secondary: #ffffff;
      --secondary-container: #ece0fa;
      --on-secondary-container: #3b1f5e;
      --tertiary: #0096cc;
      --tertiary-container: #d8f3fc;
      --on-tertiary-container: #0c4a6e;
      --error: #c53030;
      --on-error: #ffffff;

      /* Data series */
      --data-1: #c2207f;
      --data-2: #7c52aa;
      --data-3: #0096cc;
      --data-4: #d96a00;
      --data-context: #c8b8d0;

      /* Semantic tokens */
      --positive: #15803d;
      --on-positive: #ffffff;
      --positive-container: #dcfce7;
      --on-positive-container: #14532d;
      --warning: #b45309;
      --warning-container: #fef3c7;
      --on-warning-container: #78350f;
      --focus: #c2207f;

      /* Illustration palette tokens (so zero raw colors appear below :root) */
      --ill-gold: #f59e0b;
      --ill-gold-bright: #fbbf24;
      --ill-gold-light: #fef08a;
      --ill-red: #dc2626;
      --ill-red-soft: #ef4444;
      --ill-pink: #f472b6;
      --ill-pink-soft: #fbcfe8;
      --ill-green: #16a34a;
      --ill-green-dark: #15803d;
      --ill-green-light: #86efac;
      --ill-brown: #92400e;
      --ill-brown-light: #d97706;
      --ill-sky: #38bdf8;
      --ill-sky-soft: #e0f2fe;
      --ill-blue: #0284c7;
      --ill-night: #312e81;
      --ill-cream: #fffbeb;
      --ill-white: #ffffff;
      --ill-ink: #2e1a28;
      --ill-orange: #f97316;

      /* Fonts */
      --font-headline: 'DM Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-label: 'DM Sans', sans-serif;

      /* Type scale (Focused Tool) */
      --display-size: clamp(1.875rem, 1.4rem + 1.5vw, 2.5rem);
      --headline-size: clamp(1.375rem, 1.15rem + 0.6vw, 1.75rem);
      --subhead-size: clamp(1.125rem, 1rem + 0.35vw, 1.3125rem);
      --body-size: clamp(1rem, 0.95rem + 0.2vw, 1.125rem);
      --label-size: 0.8125rem;

      /* Shape */
      --rounded: 1.25rem;
      --rounded-lg: 2rem;
      --rounded-full: 9999px;

      /* Spacing scale (4pt base) */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Style effects */
      --shadow-pink: 0 4px 16px rgb(224 64 160 / 0.2);
      --shadow-pink-deep: 0 10px 28px rgb(224 64 160 / 0.32);
      --shadow-grape: 0 4px 16px rgb(124 82 170 / 0.2);
      --shadow-grape-deep: 0 10px 28px rgb(124 82 170 / 0.32);
      --shadow-sky: 0 4px 16px rgb(0 150 204 / 0.2);
      --shadow-sky-deep: 0 10px 28px rgb(0 150 204 / 0.32);
      --shadow-positive: 0 6px 20px rgb(21 128 61 / 0.24);
      --focus-ring-shadow: 0 0 0 4px rgb(194 32 127 / 0.2);
      --pop-scale: scale(1.03);
      --lift: translateY(-4px);

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    header { position: static !important; }

    button, input, select, textarea {
      font-family: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-lg) var(--space-md) var(--space-2xl);
      display: grid;
      gap: var(--space-lg);
      min-height: 100vh;
      align-content: start;
    }
    .app-shell * { min-width: 0; }

    /* Top Winner Banner */
    .winner-header {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-grape);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .winner-identity {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .crown-badge {
      width: 52px;
      height: 52px;
      border-radius: var(--rounded-full);
      background: var(--warning-container);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-pink);
    }
    .winner-text-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .winner-kicker {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--on-surface-variant);
    }
    .winner-name {
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--on-surface);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    /* Pill Badges & Chips */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      border-radius: var(--rounded-full);
      padding: var(--space-xs) var(--space-md);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .badge-stars {
      background: var(--warning-container);
      color: var(--on-warning-container);
      min-height: 44px;
      padding: var(--space-xs) var(--space-md);
      font-size: 0.9375rem;
    }
    .badge-lengua {
      background: var(--primary-container);
      color: var(--on-primary-container);
      text-transform: uppercase;
    }
    .badge-mate {
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      text-transform: uppercase;
    }
    .badge-done {
      background: var(--positive-container);
      color: var(--on-positive-container);
    }

    /* Buttons (Sticker Pills) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      min-height: 48px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      border: 0;
      font-family: var(--font-body);
      font-size: var(--body-size);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform var(--dur-short) var(--ease-bounce),
                  box-shadow var(--dur-short) var(--ease-out),
                  background-color var(--dur-short) var(--ease-out);
      user-select: none;
    }
    .btn:hover:not(:disabled) { transform: var(--pop-scale); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-pink);
    }
    .btn-primary:hover:not(:disabled) { box-shadow: var(--shadow-pink-deep); }

    .btn-secondary {
      background: var(--secondary);
      color: var(--on-secondary);
      box-shadow: var(--shadow-grape);
    }
    .btn-secondary:hover:not(:disabled) { box-shadow: var(--shadow-grape-deep); }

    .btn-soft {
      background: var(--surface-container);
      color: var(--on-surface);
      border: 2px solid var(--outline-variant);
    }
    .btn-soft:hover:not(:disabled) {
      background: var(--surface-container-high);
      border-color: var(--outline);
    }

    .btn-positive {
      background: var(--positive);
      color: var(--on-positive);
      box-shadow: var(--shadow-positive);
    }

    .btn-quiet {
      background: transparent;
      color: var(--primary);
      padding: var(--space-xs) var(--space-md);
    }
    .btn-quiet:hover:not(:disabled) {
      background: var(--surface-container);
    }

    .btn-lg {
      min-height: 58px;
      padding: var(--space-md) var(--space-xl);
      font-size: var(--subhead-size);
    }

    /* Typography */
    .display {
      font-family: var(--font-headline);
      font-weight: 900;
      font-size: var(--display-size);
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 0;
      color: var(--on-surface);
    }
    .display em {
      font-style: normal;
      color: var(--primary);
    }
    .section-title {
      font-family: var(--font-headline);
      font-weight: 800;
      font-size: var(--headline-size);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0;
      color: var(--on-surface);
    }
    .section-title em {
      font-style: normal;
      color: var(--primary);
    }
    .helper-text {
      color: var(--on-surface-variant);
      font-size: var(--body-size);
      margin: 0;
      max-width: 60ch;
    }

    /* Cards */
    .hero-panel {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-pink);
      padding: var(--space-xl);
      display: grid;
      gap: var(--space-lg);
    }
    .activity-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-pink);
      padding: var(--space-xl);
      display: grid;
      gap: var(--space-lg);
      animation: cardEnter var(--dur-long) var(--ease-bounce) both;
    }
    .card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-pink);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
      align-content: start;
    }
    .card-sky { box-shadow: var(--shadow-sky); }
    .card-grape { box-shadow: var(--shadow-grape); }

    /* Form Controls */
    .field-group {
      display: grid;
      gap: var(--space-sm);
    }
    .field-label {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: var(--subhead-size);
      color: var(--on-surface);
    }
    .input-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: var(--space-md);
    }
    .pill-input {
      flex: 1 1 240px;
      min-height: 58px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      border: 3px solid var(--outline);
      background: var(--surface-container);
      color: var(--on-surface);
      font-size: 1.25rem;
      font-weight: 700;
      transition: border-color var(--dur-short) var(--ease-out),
                  box-shadow var(--dur-short) var(--ease-out);
    }
    .pill-input:focus {
      border-color: var(--primary);
      background: var(--surface-container-low);
      outline: none;
      box-shadow: var(--focus-ring-shadow);
    }

    /* Inline message / feedback */
    .feedback-banner {
      border-radius: var(--rounded);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-weight: 700;
      font-size: var(--subhead-size);
      animation: popIn var(--dur-short) var(--ease-bounce) both;
    }
    .feedback-banner.is-success {
      background: var(--positive-container);
      color: var(--on-positive-container);
    }
    .feedback-banner.is-try {
      background: var(--warning-container);
      color: var(--on-warning-container);
    }
    .feedback-banner.is-error {
      background: var(--surface-container);
      color: var(--error);
    }

    /* Menu Grid */
    .menu-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .menu-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
      align-content: space-between;
      transition: transform var(--dur-short) var(--ease-bounce),
                  box-shadow var(--dur-short) var(--ease-out);
    }
    .menu-card.is-pink { box-shadow: var(--shadow-pink); }
    .menu-card.is-grape { box-shadow: var(--shadow-grape); }
    .menu-card.is-sky { box-shadow: var(--shadow-sky); }
    .menu-card:hover { transform: var(--lift); }

    .menu-icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: var(--rounded);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-icon-wrap.is-pink { background: var(--surface-container); }
    .menu-icon-wrap.is-grape { background: var(--secondary-container); }
    .menu-icon-wrap.is-sky { background: var(--tertiary-container); }

    /* Lollipop Progress Bar */
    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .progress-track {
      width: 100%;
      height: 18px;
      background: var(--surface-container-high);
      border-radius: var(--rounded-full);
      overflow: hidden;
      padding: 3px;
    }
    .progress-fill {
      height: 100%;
      background: var(--tertiary);
      border-radius: var(--rounded-full);
      transition: width var(--dur-long) var(--ease-bounce);
      min-width: 18px;
    }
    .progress-fill.is-pink { background: var(--primary); }
    .progress-fill.is-grape { background: var(--secondary); }

    /* Illustration Stage */
    .illustration-stage {
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      min-height: 210px;
    }
    .illustration-svg {
      width: 164px;
      height: 164px;
      max-width: 100%;
    }

    /* Activity 1: Word Tiles & Missing Letter */
    .word-tiles {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
    }
    .letter-tile {
      width: 56px;
      height: 64px;
      border-radius: var(--rounded);
      background: var(--surface-container-low);
      box-shadow: var(--shadow-grape);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-headline);
      font-size: 2.125rem;
      font-weight: 900;
      color: var(--on-surface);
      user-select: none;
    }
    .letter-tile.is-missing {
      background: var(--surface-container);
      border: 3px dashed var(--primary);
      color: var(--primary);
      box-shadow: var(--shadow-pink);
    }
    .letter-tile.is-solved {
      background: var(--positive-container);
      border: 3px solid var(--positive);
      color: var(--on-positive-container);
      box-shadow: var(--shadow-positive);
    }
    .letter-input-slot {
      width: 68px;
      height: 70px;
      border-radius: var(--rounded);
      border: 3px solid var(--primary);
      background: var(--surface-container-low);
      color: var(--primary);
      font-family: var(--font-headline);
      font-size: 2.25rem;
      font-weight: 900;
      text-align: center;
      box-shadow: var(--shadow-pink);
    }
    .letter-input-slot:focus {
      outline: none;
      box-shadow: var(--focus-ring-shadow);
    }

    .vowel-pad {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-sm);
    }
    .vowel-btn {
      min-width: 60px;
      min-height: 60px;
      border-radius: var(--rounded);
      border: 2px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-family: var(--font-headline);
      font-size: 1.625rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-grape);
      transition: transform var(--dur-short) var(--ease-bounce),
                  background-color var(--dur-short) var(--ease-out),
                  border-color var(--dur-short) var(--ease-out);
    }
    .vowel-btn:hover:not(:disabled) {
      transform: var(--pop-scale);
      border-color: var(--primary);
      background: var(--surface-container);
    }
    .vowel-btn:active:not(:disabled) { transform: scale(0.95); }

    /* Activity 2: Hint Letters */
    .hint-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      font-weight: 800;
      letter-spacing: 0.14em;
      font-size: 1.125rem;
    }

    /* Activity 3: Math Addition */
    .math-stage {
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-lg);
      justify-items: center;
    }
    .math-vertical {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-sky);
      padding: var(--space-lg) var(--space-xl);
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: var(--space-xs) var(--space-md);
      align-items: center;
      font-family: var(--font-headline);
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.5rem, 2rem + 2vw, 3.5rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--on-surface);
    }
    .math-op {
      color: var(--primary);
      text-align: center;
    }
    .math-num {
      text-align: right;
      letter-spacing: 0.08em;
    }
    .math-rule {
      grid-column: 1 / -1;
      height: 4px;
      background: var(--on-surface);
      border-radius: var(--rounded-full);
      margin: var(--space-xs) 0;
    }
    .math-answer-box {
      grid-column: 2;
      text-align: right;
      color: var(--secondary);
    }

    .math-options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md);
    }
    .math-option-btn {
      min-height: 84px;
      border-radius: var(--rounded-lg);
      border: 3px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-family: var(--font-headline);
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.875rem, 1.5rem + 1.2vw, 2.375rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-sky);
      transition: transform var(--dur-short) var(--ease-bounce),
                  box-shadow var(--dur-short) var(--ease-out),
                  background-color var(--dur-short) var(--ease-out),
                  border-color var(--dur-short) var(--ease-out);
    }
    .math-option-btn:hover:not(:disabled) {
      transform: var(--pop-scale);
      border-color: var(--secondary);
      box-shadow: var(--shadow-sky-deep);
    }
    .math-option-btn:active:not(:disabled) { transform: scale(0.97); }
    .math-option-btn.is-correct {
      background: var(--positive);
      color: var(--on-positive);
      border-color: var(--positive);
      box-shadow: var(--shadow-positive);
    }
    .math-option-btn.is-wrong {
      background: var(--surface-container-high);
      color: var(--on-surface-variant);
      border-color: var(--outline-variant);
      box-shadow: none;
      opacity: 0.55;
      cursor: default;
    }

    /* Visual Tens & Ones Helper */
    .visual-blocks-panel {
      width: 100%;
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      padding: var(--space-md);
      display: grid;
      gap: var(--space-sm);
      box-shadow: var(--shadow-grape);
    }
    .blocks-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
    }
    .blocks-label {
      font-weight: 800;
      min-width: 54px;
      font-variant-numeric: tabular-nums;
      color: var(--on-surface);
    }
    .ten-bar {
      width: 16px;
      height: 36px;
      border-radius: var(--rounded-full);
      background: var(--tertiary);
      display: inline-block;
    }
    .one-dot {
      width: 14px;
      height: 14px;
      border-radius: var(--rounded-full);
      background: var(--primary);
      display: inline-block;
    }
    .blocks-legend {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-surface-variant);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
    }

    /* Celebration Screen */
    .celebration-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-pink-deep);
      padding: var(--space-2xl) var(--space-lg);
      display: grid;
      justify-items: center;
      text-align: center;
      gap: var(--space-lg);
      animation: cardEnter var(--dur-long) var(--ease-bounce) both;
    }

    .action-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .center-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
    }

    /* Container query adaptation */
    .activity-wrapper { container-type: inline-size; }
    @container (min-width: 620px) {
      .split-activity {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        gap: var(--space-xl);
        align-items: center;
      }
    }
    @container (max-width: 619px) {
      .split-activity {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-lg);
      }
    }

    /* Animations */
    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Mobile breakpoint */
    @media (max-width: 640px) {
      .app-shell {
        padding: var(--space-sm) var(--space-sm) var(--space-xl);
        gap: var(--space-md);
      }
      .winner-header {
        padding: var(--space-md);
      }
      .hero-panel,
      .activity-card {
        padding: var(--space-lg) var(--space-md);
      }
      .letter-tile {
        width: 46px;
        height: 54px;
        font-size: 1.75rem;
      }
      .letter-input-slot {
        width: 56px;
        height: 60px;
        font-size: 1.875rem;
      }
      .vowel-btn {
        min-width: 52px;
        min-height: 54px;
        font-size: 1.375rem;
      }
      .math-option-btn {
        min-height: 74px;
      }
      .action-footer {
        justify-content: center;
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

    /* ===========================
       2. APP STATE & PERSISTENCE
       =========================== */
    let appState = {
      studentName: ``,
      soundEnabled: true,
      view: `welcome`,
      act1: { currentIndex: 0, completedIds: [], finished: false },
      act2: { currentIndex: 0, completedIds: [], finished: false },
      act3: { currentIndex: 0, completedIds: [], showVisualHelp: true, finished: false }
    };

    let transientState = {
      act1Feedback: null,
      act1SolvedCurrent: false,
      act2Feedback: null,
      act2SolvedCurrent: false,
      act2HintShown: false,
      act3Feedback: null,
      act3SolvedCurrent: false,
      act3WrongOptions: []
    };

    async function saveState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState(appState);
        }
      } catch (err) {
        /* Fail gracefully in standalone preview */
      }
    }

    async function loadState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            if (typeof saved.studentName === `string`) appState.studentName = saved.studentName;
            if (typeof saved.soundEnabled === `boolean`) appState.soundEnabled = saved.soundEnabled;
            if (saved.act1 && Array.isArray(saved.act1.completedIds)) {
              appState.act1 = {
                currentIndex: Number(saved.act1.currentIndex) || 0,
                completedIds: saved.act1.completedIds,
                finished: Boolean(saved.act1.finished)
              };
            }
            if (saved.act2 && Array.isArray(saved.act2.completedIds)) {
              appState.act2 = {
                currentIndex: Number(saved.act2.currentIndex) || 0,
                completedIds: saved.act2.completedIds,
                finished: Boolean(saved.act2.finished)
              };
            }
            if (saved.act3 && Array.isArray(saved.act3.completedIds)) {
              appState.act3 = {
                currentIndex: Number(saved.act3.currentIndex) || 0,
                completedIds: saved.act3.completedIds,
                showVisualHelp: saved.act3.showVisualHelp !== false,
                finished: Boolean(saved.act3.finished)
              };
            }
            if (appState.studentName.trim().length > 0) {
              appState.view = `menu`;
            }
          }
        }
      } catch (err) {
        /* Start fresh if state unavailable */
      }
    }

    /* ===========================
       3. AUDIO & SPEECH SUPPORT
       =========================== */
    let audioCtx = null;

    function playTone(type) {
      if (!appState.soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === `suspended`) audioCtx.resume();

        const now = audioCtx.currentTime;
        const notes = type === `win`
          ? [523.25, 659.25, 783.99, 1046.5]
          : type === `ok`
            ? [523.25, 659.25, 783.99]
            : [330, 293.66];

        notes.forEach(function (freq, idx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type === `try` ? `sine` : `triangle`;
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.001, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.12, now + idx * 0.09 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.24);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.26);
        });
      } catch (err) {
        /* Ignore audio errors */
      }
    }

    function speakText(text) {
      if (!appState.soundEnabled) return;
      try {
        if (!(`speechSynthesis` in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = `es-419`;
        utter.rate = 0.92;
        utter.pitch = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (err) {
        /* Ignore speech errors */
      }
    }

    function toggleSound() {
      appState.soundEnabled = !appState.soundEnabled;
      if (!appState.soundEnabled && `speechSynthesis` in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      saveState();
      updateHeader();
    }

    /* ===========================
       4. HELPERS & NAVIGATION
       =========================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`)
        .replace(/'/g, `&#39;`);
    }

    function normalizeText(str) {
      return String(str || ``)
        .trim()
        .toLowerCase()
        .normalize(`NFD`)
        .replace(/[\u0300-\u036f]/g, ``);
    }

    function getTotalStars() {
      return appState.act1.completedIds.length +
             appState.act2.completedIds.length +
             appState.act3.completedIds.length;
    }

    function resetTransient() {
      transientState = {
        act1Feedback: null,
        act1SolvedCurrent: false,
        act2Feedback: null,
        act2SolvedCurrent: false,
        act2HintShown: false,
        act3Feedback: null,
        act3SolvedCurrent: false,
        act3WrongOptions: []
      };
    }

    function updateHeader() {
      const header = document.getElementById(`winner-header`);
      const nameEl = document.getElementById(`header-student-name`);
      const starsEl = document.getElementById(`header-stars-count`);
      const backBtn = document.getElementById(`btn-back-menu`);
      const soundLabel = document.getElementById(`sound-label`);
      const soundIconSlot = document.getElementById(`sound-icon-slot`);
      if (!header || !nameEl || !starsEl || !backBtn || !soundLabel || !soundIconSlot) return;

      if (appState.view === `welcome`) {
        header.style.display = `none`;
        return;
      }

      header.style.display = `flex`;
      nameEl.textContent = appState.studentName || `Campeón`;
      starsEl.textContent = String(getTotalStars());
      backBtn.style.display = appState.view === `menu` ? `none` : `inline-flex`;

      soundLabel.textContent = appState.soundEnabled ? `Sonido: Sí` : `Sonido: No`;
      soundIconSlot.innerHTML = appState.soundEnabled
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
    }

    function goToWelcome() {
      appState.view = `welcome`;
      resetTransient();
      saveState();
      render();
    }

    function goToMenu() {
      appState.view = `menu`;
      resetTransient();
      saveState();
      render();
    }

    function startActivity(actNumber) {
      resetTransient();
      if (actNumber === 1) {
        if (appState.act1.finished) {
          appState.act1.currentIndex = 0;
          appState.act1.finished = false;
        }
        appState.view = `act1`;
      } else if (actNumber === 2) {
        if (appState.act2.finished) {
          appState.act2.currentIndex = 0;
          appState.act2.finished = false;
        }
        appState.view = `act2`;
      } else if (actNumber === 3) {
        if (appState.act3.finished) {
          appState.act3.currentIndex = 0;
          appState.act3.finished = false;
        }
        appState.view = `act3`;
      }
      saveState();
      render();
    }

    /* ===========================
       5. SCREEN HANDLERS
       =========================== */
    function submitStudentName(event) {
      if (event) event.preventDefault();
      const input = document.getElementById(`student-name-input`);
      const errorBox = document.getElementById(`welcome-error`);
      if (!input) return;

      const raw = input.value.trim();
      if (raw.length < 1) {
        if (errorBox) {
          errorBox.style.display = `flex`;
          errorBox.textContent = `Por favor, escribe tu nombre para comenzar tu aventura.`;
        }
        input.focus();
        return;
      }

      appState.studentName = raw;
      appState.view = `menu`;
      playTone(`ok`);
      speakText(`¡Hola ${raw}! Qué alegría verte. Elige una actividad.`);
      saveState();
      render();
    }

    function resetAllProgress(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `Toca otra vez para reiniciar estrellas`;
        return;
      }
      appState.act1 = { currentIndex: 0, completedIds: [], finished: false };
      appState.act2 = { currentIndex: 0, completedIds: [], finished: false };
      appState.act3 = { currentIndex: 0, completedIds: [], showVisualHelp: appState.act3.showVisualHelp, finished: false };
      resetTransient();
      saveState();
      render();
    }

    /* --- Activity 1 Handlers --- */
    function checkAct1Letter(letterValue) {
      const idx = appState.act1.currentIndex;
      const item = ACT1_WORDS[idx];
      if (!item || transientState.act1SolvedCurrent) return;

      const input = document.getElementById(`act1-input`);
      const val = normalizeText(typeof letterValue === `string` ? letterValue : (input ? input.value : ``));

      if (!val) {
        transientState.act1Feedback = {
          type: `try`,
          text: `Escribe o toca una vocal en la casilla para completar la palabra.`
        };
        render();
        return;
      }

      if (input) input.value = val.toUpperCase();

      if (val === normalizeText(item.answer)) {
        if (appState.act1.completedIds.indexOf(idx) === -1) {
          appState.act1.completedIds.push(idx);
        }
        transientState.act1SolvedCurrent = true;
        transientState.act1Feedback = {
          type: `success`,
          text: `¡Excelente, ${appState.studentName}! Completaste "${item.word}".`
        };
        playTone(`ok`);
        speakText(`¡Muy bien ${appState.studentName}! ${item.word}.`);
        saveState();
        render();
      } else {
        transientState.act1Feedback = {
          type: `try`,
          text: `¡Casi! Prueba con otra vocal. Pista: ${item.hint}`
        };
        playTone(`try`);
        render();
      }
    }

    function handleAct1Form(event) {
      if (event) event.preventDefault();
      checkAct1Letter();
    }

    function tapVowel(vowel) {
      const input = document.getElementById(`act1-input`);
      if (input) input.value = vowel;
      checkAct1Letter(vowel);
    }

    function nextAct1Word() {
      if (appState.act1.currentIndex + 1 >= ACT1_WORDS.length) {
        appState.act1.finished = true;
        playTone(`win`);
        speakText(`¡Felicidades ${appState.studentName}! Completaste las diez palabras.`);
      } else {
        appState.act1.currentIndex += 1;
      }
      resetTransient();
      saveState();
      render();
    }

    function replayAct1() {
      appState.act1.currentIndex = 0;
      appState.act1.finished = false;
      resetTransient();
      saveState();
      render();
    }

    /* --- Activity 2 Handlers --- */
    function handleAct2Form(event) {
      if (event) event.preventDefault();
      if (transientState.act2SolvedCurrent) return;

      const idx = appState.act2.currentIndex;
      const item = ACT2_ITEMS[idx];
      const input = document.getElementById(`act2-input`);
      if (!item || !input) return;

      const guess = normalizeText(input.value);
      if (!guess) {
        transientState.act2Feedback = {
          type: `try`,
          text: `Observa el dibujo y escribe su nombre antes de comprobar.`
        };
        render();
        return;
      }

      const validMatches = item.accept.map(normalizeText);
      if (validMatches.indexOf(guess) !== -1) {
        if (appState.act2.completedIds.indexOf(idx) === -1) {
          appState.act2.completedIds.push(idx);
        }
        transientState.act2SolvedCurrent = true;
        transientState.act2Feedback = {
          type: `success`,
          text: `¡Genial, ${appState.studentName}! Es "${item.display}".`
        };
        playTone(`ok`);
        speakText(`¡Excelente ${appState.studentName}! ${item.display}.`);
        saveState();
        render();
      } else {
        transientState.act2Feedback = {
          type: `try`,
          text: `¡Buen intento! Mira bien el dibujo o toca "Ver pista".`
        };
        playTone(`try`);
        render();
      }
    }

    function showAct2Hint() {
      transientState.act2HintShown = true;
      render();
    }

    function nextAct2Item() {
      if (appState.act2.currentIndex + 1 >= ACT2_ITEMS.length) {
        appState.act2.finished = true;
        playTone(`win`);
        speakText(`¡Campeón ${appState.studentName}! Escribiste todos los nombres.`);
      } else {
        appState.act2.currentIndex += 1;
      }
      resetTransient();
      saveState();
      render();
    }

    function replayAct2() {
      appState.act2.currentIndex = 0;
      appState.act2.finished = false;
      resetTransient();
      saveState();
      render();
    }

    /* --- Activity 3 Handlers --- */
    function selectMathOption(chosen) {
      if (transientState.act3SolvedCurrent) return;
      const idx = appState.act3.currentIndex;
      const item = ACT3_SUMS[idx];
      if (!item) return;

      if (chosen === item.answer) {
        if (appState.act3.completedIds.indexOf(idx) === -1) {
          appState.act3.completedIds.push(idx);
        }
        transientState.act3SolvedCurrent = true;
        transientState.act3Feedback = {
          type: `success`,
          text: `¡Fantástico, ${appState.studentName}! ${item.a} + ${item.b} = ${item.answer}.`
        };
        playTone(`ok`);
        speakText(`¡Correcto! ${item.a} más ${item.b} es ${item.answer}.`);
        saveState();
        render();
      } else {
        if (transientState.act3WrongOptions.indexOf(chosen) === -1) {
          transientState.act3WrongOptions.push(chosen);
        }
        transientState.act3Feedback = {
          type: `try`,
          text: `¡Sigue intentando, ${appState.studentName}! Prueba con otro número.`
        };
        playTone(`try`);
        render();
      }
    }

    function toggleMathVisualHelp() {
      appState.act3.showVisualHelp = !appState.act3.showVisualHelp;
      saveState();
      render();
    }

    function nextAct3Sum() {
      if (appState.act3.currentIndex + 1 >= ACT3_SUMS.length) {
        appState.act3.finished = true;
        playTone(`win`);
        speakText(`¡Lo lograste ${appState.studentName}! Resolviste todas las sumas.`);
      } else {
        appState.act3.currentIndex += 1;
      }
      resetTransient();
      saveState();
      render();
    }

    function replayAct3() {
      appState.act3.currentIndex = 0;
      appState.act3.finished = false;
      resetTransient();
      saveState();
      render();
    }

                <div class="menu-icon-wrap is-grape" aria-hidden="true">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                  </svg>
                </div>
                <span class="badge badge-lengua">Lengua • Actividad 2</span>
              </div>
              <h2 class="section-title">¿Qué dibujo es?</h2>
              <p class="helper-text">Observa cada ilustración y escribe el nombre del objeto.</p>
            </div>
            <div style="display: grid; gap: var(--space-md);">
              <div class="progress-header">
                <span class="badge ${a2Done === ACT2_ITEMS.length ? `badge-done` : `badge-stars`}">
                  ${a2Done} de ${ACT2_ITEMS.length} estrellas
                </span>
              </div>
              <button type="button" class="btn btn-secondary btn-lg" onclick="startActivity(2)">
                ${a2Done === ACT2_ITEMS.length ? `Volver a jugar` : `Entrar a Actividad 2`}
              </button>
            </div>
          </article>

          <article class="menu-card is-sky">
            <div style="display: grid; gap: var(--space-sm);">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm);">
                <div class="menu-icon-wrap is-sky" aria-hidden="true">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--on-tertiary-container)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="3"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="12" y2="12"/><line x1="10" y1="10" x2="10" y2="14"/><line x1="14" y1="16" x2="16" y2="16"/>
                  </svg>
                </div>
                <span class="badge badge-mate">Matemáticas • Actividad 3</span>
              </div>
              <h2 class="section-title">Sumas divertidas</h2>
              <p class="helper-text">Resuelve sumas simples de 2 cifras tocando el botón con el resultado correcto.</p>
            </div>
            <div style="display: grid; gap: var(--space-md);">
              <div class="progress-header">
                <span class="badge ${a3Done === ACT3_SUMS.length ? `badge-done` : `badge-stars`}">
                  ${a3Done} de ${ACT3_SUMS.length} estrellas
                </span>
              </div>
              <button type="button" class="btn btn-primary btn-lg" onclick="startActivity(3)">
                ${a3Done === ACT3_SUMS.length ? `Volver a jugar` : `Entrar a Actividad 3`}
              </button>
            </div>
          </article>
        </section>

        <div class="center-row" style="justify-content: flex-end;">
          <button type="button" class="btn btn-quiet" onclick="resetAllProgress(this)">
            Reiniciar estrellas
          </button>
        </div>
      `;
    }

    function renderCelebration(titleText, subtitleText, replayFnName) {
      return `
        <section class="celebration-card">
          <div class="crown-badge" aria-hidden="true" style="width: 92px; height: 92px;">
            <svg width="60" height="60" viewBox="0 0 48 48" fill="none">
              <path d="M6 34L4 14L15 23L24 10L33 23L44 14L42 34H6Z" fill="var(--ill-gold-bright)" stroke="var(--ill-brown)" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="7" y="35" width="34" height="6" rx="3" fill="var(--ill-gold)" stroke="var(--ill-brown)" stroke-width="2.5"/>
              <circle cx="24" cy="9" r="3.5" fill="var(--ill-pink)" stroke="var(--ill-brown)" stroke-width="2"/>
              <circle cx="4" cy="13" r="3" fill="var(--ill-sky)" stroke="var(--ill-brown)" stroke-width="2"/>
              <circle cx="44" cy="13" r="3" fill="var(--ill-sky)" stroke="var(--ill-brown)" stroke-width="2"/>
            </svg>
          </div>
          <h1 class="display">¡Felicidades, <em>${escapeHtml(appState.studentName)}</em>!</h1>
          <h2 class="section-title">${escapeHtml(titleText)}</h2>
          <p class="helper-text">${escapeHtml(subtitleText)}</p>
          <div class="center-row">
            <button type="button" class="btn btn-primary btn-lg" onclick="goToMenu()">
              Volver al menú principal
            </button>
            <button type="button" class="btn btn-soft btn-lg" onclick="${replayFnName}()">
              Practicar otra vez
            </button>
          </div>
        </section>
      `;
    }

    function renderActivity1() {
      if (appState.act1.finished) {
        return renderCelebration(
          `¡Completaste las 10 palabras!`,
          `Hiciste un trabajo maravilloso leyendo y completando cada palabra.`,
          `replayAct1`
        );
      }

      const idx = appState.act1.currentIndex;
      const item = ACT1_WORDS[idx];
      const pct = Math.round(((idx + (transientState.act1SolvedCurrent ? 1 : 0)) / ACT1_WORDS.length) * 100);
      const chars = item.word.split(``);

      const tilesHtml = chars.map(function (ch, pos) {
        if (pos === item.missingIndex) {
          if (transientState.act1SolvedCurrent) {
            return `<span class="letter-tile is-solved" aria-label="Letra correcta: ${escapeHtml(item.answer)}">${escapeHtml(item.answer)}</span>`;
          }
          return `<input
            id="act1-input"
            type="text"
            class="letter-input-slot"
            maxlength="1"
            autocomplete="off"
            autocapitalize="none"
            aria-label="Escribe la letra que falta"
          >`;
        }
        return `<span class="letter-tile">${escapeHtml(ch)}</span>`;
      }).join(``);

      const feedbackHtml = transientState.act1Feedback
        ? `<div class="feedback-banner ${transientState.act1Feedback.type === `success` ? `is-success` : `is-try`}" role="status" aria-live="polite">
             <span>${escapeHtml(transientState.act1Feedback.text)}</span>
           </div>`
        : ``;

      const vowelButtonsHtml = VOWELS.map(function (v) {
        return `<button type="button" class="vowel-btn" onclick="tapVowel('${v}')" ${transientState.act1SolvedCurrent ? `disabled` : ``}>${v}</button>`;
      }).join(``);

      return `
        <section class="activity-card">
          <div class="progress-header">
            <div style="display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap;">
              <span class="badge badge-lengua">Lengua • Actividad 1</span>
              <span class="badge badge-stars">Palabra ${idx + 1} de ${ACT1_WORDS.length}</span>
            </div>
            <button type="button" class="btn btn-soft" onclick="speakText('Completa la letra que falta en la palabra.')">
              Escuchar ayuda
            </button>
          </div>

          <div class="progress-track" aria-label="Progreso de palabras">
            <div class="progress-fill is-pink" style="width: ${pct}%;"></div>
          </div>

          <div class="split-activity">
            <div class="illustration-stage">
              ${getIllustrationSvg(item.svgKey)}
              <p class="helper-text" style="text-align: center; font-weight: 600;">${escapeHtml(item.hint)}</p>
            </div>

            <div style="display: grid; gap: var(--space-lg);">
              <div>
                <h1 class="section-title">Completa la <em>letra</em> que falta</h1>
                <p class="helper-text" style="margin-top: var(--space-xs);">
                  Escribe la letra en la casilla o toca una vocal de abajo.
                </p>
              </div>

              <form onsubmit="handleAct1Form(event)" style="display: grid; gap: var(--space-md);">
                ${transientState.act1SolvedCurrent
                  ? `<span class="field-label" style="text-align: center;">Palabra completada:</span>`
                  : `<label for="act1-input" class="field-label" style="text-align: center;">Palabra para completar:</label>`
                }
                <div class="word-tiles">
                  ${tilesHtml}
                </div>

                <div class="vowel-pad" aria-label="Botones rápidos de vocales">
                  ${vowelButtonsHtml}
                </div>

                ${feedbackHtml}

                <div class="center-row">
                  ${transientState.act1SolvedCurrent
                    ? `<button type="button" class="btn btn-positive btn-lg" onclick="nextAct1Word()">
                         ${idx + 1 >= ACT1_WORDS.length ? `Ver mi premio` : `Siguiente palabra →`}
                       </button>`
                    : `<button type="submit" class="btn btn-primary btn-lg">
                         Comprobar respuesta
                       </button>`
                  }
                </div>
              </form>
            </div>
          </div>
        </section>
      `;
    }

    function renderActivity2() {
      if (appState.act2.finished) {
        return renderCelebration(
          `¡Escribiste todos los nombres!`,
          `Observaste cada ilustración con mucha atención y escribiste súper bien.`,
          `replayAct2`
        );
      }

      const idx = appState.act2.currentIndex;
      const item = ACT2_ITEMS[idx];
      const pct = Math.round(((idx + (transientState.act2SolvedCurrent ? 1 : 0)) / ACT2_ITEMS.length) * 100);
      const firstChar = item.display.charAt(0).toUpperCase();
      const totalChars = item.display.length;

      const feedbackHtml = transientState.act2Feedback
        ? `<div class="feedback-banner ${transientState.act2Feedback.type === `success` ? `is-success` : `is-try`}" role="status" aria-live="polite">
             <span>${escapeHtml(transientState.act2Feedback.text)}</span>
           </div>`
        : ``;

      const hintHtml = transientState.act2HintShown
        ? `<div class="center-row">
             <span class="hint-pill">Empieza con "${escapeHtml(firstChar)}" • ${totalChars} letras</span>
           </div>`
        : ``;

      return `
        <section class="activity-card" style="box-shadow: var(--shadow-grape);">
          <div class="progress-header">
            <div style="display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap;">
              <span class="badge badge-lengua">Lengua • Actividad 2</span>
              <span class="badge badge-stars">Dibujo ${idx + 1} de ${ACT2_ITEMS.length}</span>
            </div>
            <button type="button" class="btn btn-soft" onclick="speakText('Observa el dibujo y escribe el nombre del objeto.')">
              Escuchar ayuda
            </button>
          </div>

          <div class="progress-track" aria-label="Progreso de dibujos">
            <div class="progress-fill is-grape" style="width: ${pct}%;"></div>
          </div>

          <div class="split-activity">
            <div class="illustration-stage">
              ${getIllustrationSvg(item.svgKey)}
              <p class="helper-text" style="text-align: center; font-weight: 600;">${escapeHtml(item.hintText)}</p>
            </div>

            <div style="display: grid; gap: var(--space-lg);">
              <div>
                <h1 class="section-title">¿Qué <em>dibujo</em> ves aquí?</h1>
                <p class="helper-text" style="margin-top: var(--space-xs);">
                  Observa la imagen y escribe su nombre completo.
                </p>
              </div>

              ${hintHtml}

              <form onsubmit="handleAct2Form(event)" class="field-group">
                <label for="act2-input" class="field-label">Escribe el nombre del objeto:</label>
                <div class="input-row">
                  <input
                    id="act2-input"
                    type="text"
                    class="pill-input"
                    autocomplete="off"
                    spellcheck="false"
                    value="${transientState.act2SolvedCurrent ? escapeHtml(item.display) : ``}"
                    ${transientState.act2SolvedCurrent ? `disabled` : ``}
                    placeholder="Escribe la palabra aquí"
                  >
                </div>

                ${feedbackHtml}

                <div class="center-row" style="justify-content: flex-start; margin-top: var(--space-xs);">
                  ${transientState.act2SolvedCurrent
                    ? `<button type="button" class="btn btn-positive btn-lg" onclick="nextAct2Item()">
                         ${idx + 1 >= ACT2_ITEMS.length ? `Ver mi premio` : `Siguiente dibujo →`}
                       </button>`
                    : `<button type="submit" class="btn btn-secondary btn-lg">
                         Comprobar palabra
                       </button>
                       <button type="button" class="btn btn-soft" onclick="showAct2Hint()">
                         Ver pista
                       </button>`
                  }
                </div>
              </form>
            </div>
          </div>
        </section>
      `;
    }

    function buildVisualBlocksRow(num) {
      const tens = Math.floor(num / 10);
      const ones = num % 10;
      let bars = ``;
      for (let t = 0; t < tens; t++) {
        bars += `<span class="ten-bar" title="10"></span>`;
      }
      let dots = ``;
      for (let o = 0; o < ones; o++) {
        dots += `<span class="one-dot" title="1"></span>`;
      }
      return `
        <div class="blocks-row">
          <span class="blocks-label">${num} =</span>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs);">
            ${bars}${dots}
          </div>
        </div>
      `;
    }

    function renderActivity3() {
      if (appState.act3.finished) {
        return renderCelebration(
          `¡Resolviste todas las sumas!`,
          `Eres un genio de los números. Tu corona brilla más que nunca.`,
          `replayAct3`
        );
      }

      const idx = appState.act3.currentIndex;
      const item = ACT3_SUMS[idx];
      const pct = Math.round(((idx + (transientState.act3SolvedCurrent ? 1 : 0)) / ACT3_SUMS.length) * 100);

      const optionsHtml = item.options.map(function (opt) {
        let stateClass = ``;
        let disabledAttr = ``;
        if (transientState.act3SolvedCurrent && opt === item.answer) {
          stateClass = `is-correct`;
        } else if (transientState.act3WrongOptions.indexOf(opt) !== -1) {
          stateClass = `is-wrong`;
          disabledAttr = `disabled`;
        } else if (transientState.act3SolvedCurrent) {
          disabledAttr = `disabled`;
        }

        return `
          <button
            type="button"
            class="math-option-btn ${stateClass}"
            onclick="selectMathOption(${opt})"
            ${disabledAttr}
          >
            ${opt}
          </button>
        `;
      }).join(``);

      const visualHelpHtml = appState.act3.showVisualHelp
        ? `<div class="visual-blocks-panel" aria-label="Ayuda visual de decenas y unidades">
             ${buildVisualBlocksRow(item.a)}
             ${buildVisualBlocksRow(item.b)}
             <div class="blocks-legend">
               <span class="legend-item"><span class="ten-bar" style="height: 18px; width: 10px;"></span> Vale 10</span>
               <span class="legend-item"><span class="one-dot"></span> Vale 1</span>
             </div>
           </div>`
        : ``;

      const feedbackHtml = transientState.act3Feedback
        ? `<div class="feedback-banner ${transientState.act3Feedback.type === `success` ? `is-success` : `is-try`}" role="status" aria-live="polite">
             <span>${escapeHtml(transientState.act3Feedback.text)}</span>
           </div>`
        : ``;

      return `
        <section class="activity-card" style="box-shadow: var(--shadow-sky);">
          <div class="progress-header">
            <div style="display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap;">
              <span class="badge badge-mate">Matemáticas • Actividad 3</span>
              <span class="badge badge-stars">Suma ${idx + 1} de ${ACT3_SUMS.length}</span>
            </div>
            <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap;">
              <button type="button" class="btn btn-soft" onclick="toggleMathVisualHelp()">
                ${appState.act3.showVisualHelp ? `Ocultar bloques` : `Ver bloques de ayuda`}
              </button>
              <button type="button" class="btn btn-soft" onclick="speakText('¿Cuánto es ${item.a} más ${item.b}? Toca la respuesta correcta.')">
                Escuchar suma
              </button>
            </div>
          </div>

          <div class="progress-track" aria-label="Progreso de sumas">
            <div class="progress-fill" style="width: ${pct}%;"></div>
          </div>

          <div class="split-activity">
            <div class="math-stage">
              <div class="math-vertical" aria-label="Suma: ${item.a} más ${item.b}">
                <span></span><span class="math-num">${item.a}</span>
                <span class="math-op">+</span><span class="math-num">${item.b}</span>
                <span class="math-rule"></span>
                <span class="math-answer-box">${transientState.act3SolvedCurrent ? item.answer : `?`}</span>
              </div>
              ${visualHelpHtml}
            </div>

            <div style="display: grid; gap: var(--space-lg);">
              <div>
                <h1 class="section-title">Toca el <em>resultado</em> correcto</h1>
                <p class="helper-text" style="margin-top: var(--space-xs);">
                  Suma las dos cantidades y elige el botón grande con la respuesta.
                </p>
              </div>

              <div class="math-options-grid" role="group" aria-label="Opciones de respuesta">
                ${optionsHtml}
              </div>

              ${feedbackHtml}

              ${transientState.act3SolvedCurrent
                ? `<div class="center-row">
                     <button type="button" class="btn btn-positive btn-lg" onclick="nextAct3Sum()">
                       ${idx + 1 >= ACT3_SUMS.length ? `Ver mi premio` : `Siguiente suma →`}
                     </button>
                   </div>`
                : ``
              }
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      updateHeader();
      const main = document.getElementById(`app-main`);
      if (!main) return;

      if (appState.view === `welcome`) {
        main.innerHTML = renderWelcome();
      } else if (appState.view === `menu`) {
        main.innerHTML = renderMenu();
      } else if (appState.view === `act1`) {
        main.innerHTML = renderActivity1();
        if (!transientState.act1SolvedCurrent) {
          const inp = document.getElementById(`act1-input`);
          if (inp) inp.focus();
        }
      } else if (appState.view === `act2`) {
        main.innerHTML = renderActivity2();
        if (!transientState.act2SolvedCurrent) {
          const inp2 = document.getElementById(`act2-input`);
          if (inp2) inp2.focus();
        }
      } else if (appState.view === `act3`) {
        main.innerHTML = renderActivity3();
      }
    }

    /* ===========================
       7. INITIALIZATION
       =========================== */
    async function initApp() {
      await loadState();
      render();
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
          window.notebookAppApi.notifyAppReady();
        }
      } catch (err) {
        /* Standalone mode */
      }
    }

    if (document.readyState === `loading`) {
      document.addEventListener(`DOMContentLoaded`, initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
